        stroke-width="38"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Single Blueprint Cyan Highlight Reticle Node -->
  <circle cx="256" cy="256" r="14" fill="#38BDF8" />
  <circle cx="256" cy="256" r="28" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4 3" opacity="0.85" />
</svg>