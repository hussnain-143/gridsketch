<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Under-Glass Ethereal Prismatic Light -->
    <radialGradient id="fgUnderGlow" cx="40%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="fgLavenderGlow" cx="70%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#c8a0f0" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#c8a0f0" stop-opacity="0" />
    </radialGradient>

    <!-- Frosted Glass Surface Tint -->
    <linearGradient id="fgGlassTint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16" />
      <stop offset="40%" stop-color="#7dd3fc" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0a0e1a" stop-opacity="0.65" />
    </linearGradient>

    <!-- Glass Specular Rim Highlight -->
    <linearGradient id="fgGlassRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="25%" stop-color="#7dd3fc" stop-opacity="0.8" />
      <stop offset="65%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#c8a0f0" stop-opacity="0.75" />
    </linearGradient>

    <!-- Top Specular Highlight Edge -->
    <linearGradient id="fgSpecularLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0" />
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="65%" stop-color="#7dd3fc" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Line Neon Gradient -->
    <linearGradient id="fgGridNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#7dd3fc" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6" />
    </linearGradient>

    <!-- Central Focal Core Aura -->
    <radialGradient id="fgCoreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#7dd3fc" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Scaled into Android Adaptive Icon Safe Zone (scale 0.74 centered at 256, 256) -->
  <g transform="translate(256, 256) scale(0.74) translate(-256, -256)">
    <!-- Atmospheric Under-Glass Light Aura -->
    <circle cx="210" cy="190" r="180" fill="url(#fgUnderGlow)" />
    <circle cx="340" cy="330" r="160" fill="url(#fgLavenderGlow)" />

    <!-- Floating 3D Frosted Glass Plate -->
    <rect x="68" y="74" width="376" height="376" rx="76" fill="#000000" fill-opacity="0.5" filter="blur(16px)" />
    <rect x="68" y="68" width="376" height="376" rx="76"
          fill="url(#fgGlassTint)"
          stroke="url(#fgGlassRim)"
          stroke-width="2.8" />
    <path d="M 130 69.5 L 382 69.5" stroke="url(#fgSpecularLine)" stroke-width="2.8" stroke-linecap="round" />

    <!-- Corner Viewfinder Registration Brackets -->
    <g stroke="url(#fgGridNeon)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M 120 162 V 120 H 162" />
      <path d="M 350 120 H 392 V 162" />
      <path d="M 120 350 V 392 H 162" />
      <path d="M 350 392 H 392 V 350" />
    </g>

    <!-- Inner Precision 3x3 Artist Grid Frame -->
    <rect x="136" y="136" width="240" height="240" rx="24"
          fill="rgba(10, 14, 26, 0.4)"
          stroke="url(#fgGridNeon)"
          stroke-width="2.4" />

    <!-- Grid Subdivisions: 3x3 cells -->
    <line x1="216" y1="136" x2="216" y2="376" stroke="#7dd3fc" stroke-width="2" stroke-dasharray="4 3" stroke-opacity="0.8" />
    <line x1="296" y1="136" x2="296" y2="376" stroke="#7dd3fc" stroke-width="2" stroke-dasharray="4 3" stroke-opacity="0.8" />
    <line x1="136" y1="216" x2="376" y2="216" stroke="#7dd3fc" stroke-width="2" stroke-dasharray="4 3" stroke-opacity="0.8" />
    <line x1="136" y1="296" x2="376" y2="296" stroke="#7dd3fc" stroke-width="2" stroke-dasharray="4 3" stroke-opacity="0.8" />

    <!-- Center Diagonal Crosshairs -->
    <line x1="216" y1="216" x2="296" y2="296" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9" />
    <line x1="296" y1="216" x2="216" y2="296" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9" />

    <!-- Central Precision Focal Node -->
    <circle cx="256" cy="256" r="30" stroke="#c8a0f0" stroke-width="2" stroke-opacity="0.8" fill="none" />
    <circle cx="256" cy="256" r="18" fill="url(#fgCoreGlow)" />
    <circle cx="256" cy="256" r="18" stroke="#ffffff" stroke-width="1.6" fill="none" stroke-opacity="0.95" />
    <circle cx="256" cy="256" r="6" fill="#0a0e1a" />
    <circle cx="254" cy="254" r="2.2" fill="#ffffff" />
  </g>
</svg>