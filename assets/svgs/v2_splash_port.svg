<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <rect width="1080" height="1920" fill="#0B0F14" />

  <!-- Subtle Ambient Radial Glow -->
  <radialGradient id="splashGlow" cx="50%" cy="46%" r="35%">
    <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.12" />
    <stop offset="100%" stop-color="#0B0F14" stop-opacity="0" />
  </radialGradient>
  <rect width="1080" height="1920" fill="url(#splashGlow)" />

  <!-- Centered G-Grid Emblem -->
  <g transform="translate(540, 880) scale(0.68) translate(-256, -256)">
    <!-- Blueprint Drafting Grid -->
    <g stroke="#334155" stroke-width="2.5" opacity="0.65">
      <line x1="80" y1="120" x2="432" y2="120" />
      <line x1="80" y1="188" x2="432" y2="188" />
      <line x1="80" y1="256" x2="432" y2="256" />
      <line x1="80" y1="324" x2="432" y2="324" />
      <line x1="80" y1="392" x2="432" y2="392" />

      <line x1="120" y1="80" x2="120" y2="432" />
      <line x1="188" y1="80" x2="188" y2="432" />
      <line x1="256" y1="80" x2="256" y2="432" />
      <line x1="324" y1="80" x2="324" y2="432" />
      <line x1="392" y1="80" x2="392" y2="432" />
    </g>

    <!-- Precision Corner Crop Marks -->
    <g stroke="#38BDF8" stroke-width="2.5" opacity="0.5" stroke-linecap="round">
      <path d="M 68 84 H 84 V 68" fill="none" />
      <path d="M 444 84 H 428 V 68" fill="none" />
      <path d="M 68 428 H 84 V 444" fill="none" />
      <path d="M 444 428 H 428 V 444" fill="none" />
    </g>

    <!-- Stylized Geometric G -->
    <path d="M 372 168 
             C 344 120, 304 104, 256 104 
             C 172 104, 112 172, 112 256 
             C 112 340, 172 408, 256 408 
             C 336 408, 396 348, 396 268 
             L 396 256 
             L 256 256"
          fill="none"
          stroke="#F8FAFC"
          stroke-width="38"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Cyan Reticle Node -->
    <circle cx="256" cy="256" r="14" fill="#38BDF8" />
    <circle cx="256" cy="256" r="28" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="4 3" opacity="0.9" />
  </g>

  <!-- Typography -->
  <text x="540" y="1120" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="46" fill="#F8FAFC" letter-spacing="1">Grid<tspan fill="#38BDF8">Sketch</tspan></text>
  <text x="540" y="1165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="13" fill="#94A3B8" letter-spacing="3.5">PRECISION DRAFTING STUDIO</text>
</svg>